name: ci
on: [push, pull_request]
jobs:
  cpu:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: deps (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libopenblas-dev
      - name: deps (mac)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: build
        run: cmake --build build
      # Model-dependent tests ([model]) need the weights; CI runs the pure-logic suite.
      - name: test
        run: ./build/tests/engine_tests "~[model]"
