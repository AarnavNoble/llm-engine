name: ci
on: [push, pull_request]
jobs:
  cpu:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: deps (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libopenblas-dev
      - name: deps (mac)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: build
        run: cmake --build build
      # Model-dependent tests ([model]) need the weights; CI runs the pure-logic suite.
      - name: test
        run: ./build/tests/engine_tests "~[model]"

  # Sanitizers, on Linux only.
  #
  # The project's claim is correctness, and 899k assertions say nothing about
  # undefined behaviour or data races: a read of uninitialised memory or a
  # torn read between the engine thread and an API thread can produce a
  # perfectly plausible token and pass every one of them. These are the checks
  # that look underneath the assertions.
  #
  # ASan and TSan cannot be combined, so they are separate configurations.
  # UBSan rides along with ASan. TSan was skipped during development because
  # it segfaults on macOS 26 arm64 on a two-thread hello world; that is a Mac
  # toolchain problem and does not apply here, which is the point of running
  # it in CI rather than locally.
  sanitizers:
    strategy:
      fail-fast: false
      matrix:
        san: [address, thread]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build libopenblas-dev
      - name: configure
        # RelWithDebInfo, not Debug: the concurrency tests need to run in
        # reasonable time, and symbolized frames need the debug info.
        run: |
          EXTRA="-fsanitize=${{ matrix.san }} -fno-omit-frame-pointer -g"
          [ "${{ matrix.san }}" = address ] && EXTRA="$EXTRA -fsanitize=undefined"
          cmake -S . -B build-san -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS="$EXTRA" -DCMAKE_CXX_FLAGS="$EXTRA" \
            -DCMAKE_EXE_LINKER_FLAGS="$EXTRA"
      - name: build
        run: cmake --build build-san
      - name: test
        # halt_on_error so a finding fails the job instead of being a log line
        # nobody reads. The model tests need weights CI does not have.
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ./build-san/tests/engine_tests "~[model]"

  deploy-manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: lint chart
        run: helm lint deploy/helm
      - name: install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform
      # Render both the GPU default and the CPU + KEDA variant, then validate
      # every manifest against the Kubernetes schemas.
      - name: render and validate
        run: |
          helm template eng deploy/helm > /tmp/gpu.yaml
          helm template eng deploy/helm \
            --set gpu.enabled=false --set backend=cpu --set image.tag=cpu \
            --set keda.enabled=true --set metrics.serviceMonitor.enabled=true \
            --set model.volume.persistentVolumeClaim=engine-models > /tmp/cpu.yaml
          kubeconform -summary -strict -kubernetes-version 1.30.0 \
            -ignore-missing-schemas /tmp/gpu.yaml /tmp/cpu.yaml
      # Dashboards and autoscalers fail silently on a renamed metric, so the
      # references are checked against src/api/metrics.cpp on every push.
      - name: observability references
        run: python3 scripts/check_observability.py
      # Prose drifts from data silently. Every headline figure quoted in the
      # README, the benchmarks doc and the write-up is checked against the JSON
      # the harness produced.
      - name: published figures match the measurements
        run: python3 scripts/check_numbers.py
      - name: cpu deployment must not tolerate the GPU taint
        run: |
          if helm template eng deploy/helm --set gpu.enabled=false | grep -qE 'tolerations|nvidia'; then
            echo "CPU rendering leaked GPU scheduling hints"; exit 1
          fi
